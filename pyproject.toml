[project]
name = "invai-imaging"
version = "0.1.0"
description = "InvAI imaging service: personalization rendering, gang-sheet nesting and composing, print-file checks, mockups"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.53.0",
  "pyvips[binary]>=3.2.0",
  "pillow>=12.3.0",
  "rectpack>=0.2.2",
  "qrcode>=8.2",
  "boto3>=1.43.101",
  "pydantic-settings>=2.15.0",
  "reportlab>=5.0.1",
  "pypdfium2>=5.13.0",
  "numpy>=2.5.3",
  "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
  "opentelemetry-instrumentation-fastapi==0.65b0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "hypothesis>=6.168.5",
    "moto[s3]>=5.2.3",
    "pypdf>=6.19.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "zxing-cpp>=3.1.1",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
